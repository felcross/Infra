services:
  postgres:
    image: postgres:16
    container_name: dbpostgres-agendador
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_usuario
    ports:
      - "5434:5432"
    networks:
      - rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d db_usuario"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - rede
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data:/data/db

  usuario:
    image: felcross/usuario:latest
    container_name: usuario
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rede

  tarefas:
    image: felcross/tarefas:latest
    container_name: tarefas
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/db_agendador
      USUARIO_URL: http://usuario:8080/usuario
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      usuario:
        condition: service_started
    networks:
      - rede

  notificacao:
    image: felcross/notificacao:latest
    container_name: notificacao
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rede

  bff:
    image: felcross/bff-agendador:latest
    container_name: bff-agendador
    environment:
      USUARIO_URL: http://usuario:8080/usuario
      TAREFAS_URL: http://tarefas:8081/tarefas
      NOTIFICACAO_URL: http://notificacao:8082/email
    ports:
      - "8083:8083"
    depends_on:
      - usuario
      - tarefas
      - notificacao
    networks:
      - rede

networks:
  rede:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: